<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Set up an AI agent like a new starter, and finish with a weekly scorecard you can download.">
<title>Agent Scorecard · Tutto</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/agent-scorecard/praxis.css">
<style>
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
/* Theme bridge: Praxis uses .dark/.light, the artifact viewer stamps data-theme */
:root{--good:145 42% 31%;--warn:44 88% 36%;--bad:4 68% 46%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--good:145 40% 55%;--warn:44 85% 55%;--bad:4 75% 65%}}
:root[data-theme="light"]{
  --background:40 10% 98%;--foreground:0 0% 12%;--card:0 0% 100%;--card-foreground:0 0% 12%;
  --muted:40 5% 90%;--muted-foreground:220 9% 46%;--border:220 13% 91%;
  --good:145 42% 31%;--warn:44 88% 36%;--bad:4 68% 46%}
:root[data-theme="dark"]{
  --background:20 14% 4%;--foreground:40 10% 98%;--card:20 14% 8%;--card-foreground:40 10% 98%;
  --muted:20 14% 12%;--muted-foreground:220 9% 60%;--border:20 14% 16%;
  --good:145 40% 55%;--warn:44 85% 55%;--bad:4 75% 65%}
body{background:hsl(var(--background));color:hsl(var(--foreground))}
.shell{max-width:84rem;margin:0 auto;padding-inline:20px;padding-block:20px 72px}
p{max-width:44rem}

/* header */
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-bottom:var(--space-4);border-bottom:1px solid hsl(var(--border))}
.topbar .left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.topbar .meta{font-size:var(--text-sm);color:hsl(var(--muted-foreground))}
.topbar .right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid hsl(var(--border));border-radius:999px;padding:3px;background:hsl(var(--card))}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font:500 var(--text-sm)/1 var(--font-sans);color:hsl(var(--muted-foreground));cursor:pointer}
.seg button[aria-pressed="true"]{background:hsl(var(--foreground));color:hsl(var(--background))}
.startfrom{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:hsl(var(--muted-foreground))}
.startfrom select{width:auto}
.hero{padding-block:var(--space-10) var(--space-8)}
.hero h1{font-size:clamp(2rem,4.5vw,3rem);margin:0 0 var(--space-4);line-height:1.08}
.hero h1 em{font-family:var(--font-editorial);font-weight:400;font-style:italic}
.hero .lead{margin:0}
.admin-banner{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:var(--space-3) var(--space-4);border:1px dashed hsl(var(--border));border-radius:var(--radius);margin-top:var(--space-6);font-size:var(--text-sm);color:hsl(var(--muted-foreground))}

/* controls */
input,textarea,select{font:inherit;font-size:var(--text-sm);color:hsl(var(--foreground));background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius-sm);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input::placeholder,textarea::placeholder{color:hsl(var(--muted-foreground))}
input:focus,textarea:focus,select:focus{outline:none;border-color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.15)}
:focus-visible{outline:2px solid hsl(var(--primary));outline-offset:2px}
button{font:inherit}
.btn{font-size:var(--text-sm);padding:9px 18px}
.btn-sm{padding:6px 12px;font-size:var(--text-sm)}
.icon-btn{border:1px solid transparent;background:transparent;color:hsl(var(--muted-foreground));border-radius:var(--radius-sm);width:34px;height:38px;font-size:18px;line-height:1;flex:none;cursor:pointer}
.icon-btn:hover{color:hsl(var(--bad));border-color:hsl(var(--border))}
.add-btn{align-self:flex-start;border:1px dashed hsl(var(--border));background:transparent;color:hsl(var(--primary));border-radius:var(--radius-sm);padding:7px 12px;font-size:var(--text-sm);font-weight:500;cursor:pointer}
.add-btn:hover{border-color:hsl(var(--primary))}
.field label,.field .lbl{display:block;font-weight:600;font-size:var(--text-sm);margin-bottom:6px}
.field .hint{font-size:var(--text-xs);color:hsl(var(--muted-foreground));margin-top:5px;line-height:1.45}
.field.wide{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 22px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 16px}
.cbx{display:flex;gap:10px;align-items:flex-start;font-size:var(--text-sm);cursor:pointer}
.cbx input{width:16px;height:16px;margin-top:3px;flex:none;accent-color:hsl(var(--primary))}
.cbx small{display:block;color:hsl(var(--muted-foreground));font-size:var(--text-xs)}
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;gap:6px;align-items:center}
.list-row .n{font:500 var(--text-xs)/1 var(--font-display);color:hsl(var(--muted-foreground));width:22px;flex:none;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:999px;padding:5px 12px;font-size:var(--text-xs);color:hsl(var(--muted-foreground));cursor:pointer}
.chips button:hover{border-color:hsl(var(--primary));color:hsl(var(--primary))}

/* layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:210px minmax(0,1fr)}.aside{grid-column:1/-1;position:static!important}}
@media (max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}}

/* step rail */
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail li{margin:0}
.rail button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 10px;border-radius:var(--radius-sm);border:0;background:transparent;color:hsl(var(--foreground));text-align:left;cursor:pointer}
.rail button:hover{background:hsl(var(--muted)/.6)}
.rail button[aria-current="step"]{background:hsl(var(--card));box-shadow:var(--shadow-sm)}
.rail .num{font:300 var(--text-xs)/1 var(--font-display);letter-spacing:var(--tracking-wider);color:hsl(var(--muted-foreground))}
.rail button[aria-current="step"] .num{color:hsl(var(--primary));font-weight:500}
.rail .t{display:block;font-weight:500;font-size:var(--text-sm);line-height:1.3}
.rail .ok{width:8px;height:8px;border-radius:50%;background:hsl(var(--border))}
.rail .ok.on{background:hsl(var(--good))}
@media (max-width:800px){.rail ol{flex-direction:row;overflow-x:auto;padding-bottom:6px}.rail li{flex:none}.rail button{grid-template-columns:24px auto auto;width:auto}}

/* panel */
.panel{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:30px 32px 22px;box-shadow:var(--shadow-sm);min-width:0}
@media (max-width:560px){.panel{padding:20px 16px 16px}}
.panel h2{font-size:var(--text-3xl);margin:0 0 var(--space-3)}
.panel .lead{font-size:var(--text-lg);margin-bottom:var(--space-6)}
.panel .section-head{margin:var(--space-10) 0 var(--space-5)}
.panel .section-head:first-child{margin-top:0}
.tip{font-family:var(--font-editorial);font-style:italic;font-size:var(--text-base);color:hsl(var(--muted-foreground));border-left:2px solid hsl(var(--primary));padding:2px 0 2px 14px;margin:0 0 var(--space-6);max-width:44rem}
.panel-foot{display:flex;justify-content:space-between;gap:10px;margin-top:var(--space-10);padding-top:var(--space-5);border-top:1px solid hsl(var(--border))}

/* goal picker */
.goal-group{margin-bottom:var(--space-6)}
.goal-group h3{font-size:var(--text-base);margin:0 0 var(--space-3)}
.goal-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.goal-opt{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;color:hsl(var(--foreground))}
.goal-opt:hover{border-color:hsl(var(--muted-foreground))}
.goal-opt[aria-pressed="true"]{border-color:hsl(var(--primary));box-shadow:0 0 0 1px hsl(var(--primary));background:hsl(var(--primary)/.06)}
.goal-opt b{font-weight:600;font-size:var(--text-sm)}
.goal-opt span{font-size:var(--text-xs);color:hsl(var(--muted-foreground));line-height:1.4}
.goal-opt[aria-pressed="true"] b::after{content:"  ✓";color:hsl(var(--primary))}
.goal{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:12px;background:hsl(var(--background))}
.goal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.goal-head h3{font-size:var(--text-lg);margin:0}
.goal-head p{margin:2px 0 0;font-size:var(--text-sm);color:hsl(var(--muted-foreground))}
.goal .trial{font-size:var(--text-xs);color:hsl(var(--warn));margin-top:10px}
.honest{border:1px solid hsl(var(--primary)/.35);background:hsl(var(--primary)/.06);border-radius:var(--radius);padding:14px 16px;margin:0 0 var(--space-6)}
.honest .eyebrow{margin-bottom:6px}
.honest p{margin:0 0 8px;font-size:var(--text-sm)}
.honest p:last-child{margin-bottom:0}
.honest button{border:0;background:none;color:hsl(var(--primary));font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:.15em}

/* trust ladder */
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;border:1px solid hsl(var(--border));border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;background:hsl(var(--background))}
.rung input{position:absolute;opacity:0;pointer-events:none}
.rung .step{font:300 var(--text-xs)/1 var(--font-display);color:hsl(var(--muted-foreground));letter-spacing:var(--tracking-wider)}
.rung strong{display:block;font-size:var(--text-sm)}
.rung small{display:block;font-size:var(--text-xs);color:hsl(var(--muted-foreground))}
.rung:has(input:checked){border-color:hsl(var(--primary));box-shadow:0 0 0 1px hsl(var(--primary));background:hsl(var(--primary)/.06)}
.rung:has(input:checked) .step{color:hsl(var(--primary));font-weight:500}
.rung:has(input:focus-visible){outline:2px solid hsl(var(--primary));outline-offset:2px}

/* aside */
.aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.aside .card{padding:18px 20px}
.aside h3{font-size:var(--text-base);margin:0 0 4px}
.strength{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.strength b{font:700 var(--text-2xl)/1.1 var(--font-display)}
.strength span{font-size:var(--text-xs);color:hsl(var(--muted-foreground))}
.meter{display:grid;grid-auto-flow:column;gap:3px;margin:12px 0 14px}
.meter i{height:6px;border-radius:2px;background:hsl(var(--muted))}
.meter i.on{background:hsl(var(--primary))}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo li{margin:0}
.todo button{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--radius-sm);padding:6px 6px;font-size:var(--text-sm);line-height:1.4;color:hsl(var(--foreground));cursor:pointer}
.todo button:hover{background:hsl(var(--muted)/.6)}
.todo .mk{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid hsl(var(--muted-foreground))}
.todo .done .mk{border-color:hsl(var(--good));background:hsl(var(--good))}
.todo .done span:last-child{color:hsl(var(--muted-foreground))}
.todo .soft .mk{border-style:dashed}
.issues .mk.block{border-radius:2px;border-color:hsl(var(--bad));background:hsl(var(--bad))}
.issues .mk.warn{border-color:hsl(var(--warn))}
.todo em{display:block;font-style:normal;font-size:var(--text-xs);color:hsl(var(--muted-foreground))}

/* tabs and outputs */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid hsl(var(--border))}
.tabs button{border:0;background:transparent;padding:10px 14px;font:500 var(--text-sm)/1.2 var(--font-sans);color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:hsl(var(--foreground));border-bottom-color:hsl(var(--primary))}
.out-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 0}
.out-bar p{margin:0;font-size:var(--text-sm);color:hsl(var(--muted-foreground));max-width:36rem}
.out-bar .btns{display:flex;gap:8px}
.paper{background:hsl(var(--background));border:1px solid hsl(var(--border));border-radius:var(--radius-sm);padding:36px 40px;overflow-x:auto}
@media (max-width:560px){.paper{padding:22px 18px}}
.paper .doc-header{margin-bottom:var(--space-8)}
.paper .brief-title{font-size:var(--text-4xl);font-weight:900;margin:0 0 var(--space-4)}
.paper .section-head{margin:var(--space-10) 0 var(--space-4)}
.paper .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px;margin:var(--space-6) 0 0}
.paper .facts div{font-size:var(--text-sm)}
.paper .facts b{display:block;font:500 var(--text-xs)/1.4 var(--font-sans);text-transform:uppercase;letter-spacing:var(--tracking-wider);color:hsl(var(--muted-foreground))}
.paper .doc-footer{margin-top:var(--space-10)}
.paper table{margin:var(--space-3) 0}
.paper td.box{min-width:64px;border-left:1px solid hsl(var(--border))}
.band{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.band.g{background:hsl(var(--good))}.band.w{background:hsl(var(--warn))}.band.b{background:hsl(var(--bad))}
pre.code{margin:0;max-height:560px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;border:1px solid hsl(var(--border))}
pre.code.nowrap{white-space:pre}

/* admin: KPI cards and instrument */
.kpi{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--background));margin-bottom:12px}
.kpi summary{list-style:none;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:14px 16px;cursor:pointer}
.kpi summary::-webkit-details-marker{display:none}
.kpi summary::before{content:"";width:7px;height:7px;border-right:1.5px solid hsl(var(--muted-foreground));border-bottom:1.5px solid hsl(var(--muted-foreground));transform:rotate(-45deg);transition:transform .15s;flex:none}
.kpi[open] summary::before{transform:rotate(45deg)}
.kpi-name{font-weight:600}
.kpi-state{margin-left:auto}
.kpi-body{padding:16px;border-top:1px solid hsl(var(--border));display:grid;gap:22px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font:500 var(--text-xs)/1 var(--font-sans);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:12px;padding:0}
.kpi-actions{display:flex;gap:8px;justify-content:flex-end}
.pill{display:inline-flex;font:500 var(--text-xs)/1 var(--font-sans);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:hsl(var(--good)/.14);color:hsl(var(--good))}
.pill.warn{background:hsl(var(--warn)/.16);color:hsl(var(--warn))}
.pill.bad{background:hsl(var(--bad)/.14);color:hsl(var(--bad))}
.instrument{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px 26px;align-items:center;padding:16px 18px;border-radius:var(--radius-sm);background:hsl(var(--muted)/.5)}
@media (max-width:700px){.instrument{grid-template-columns:minmax(0,1fr)}}
.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:13px/1.35 var(--font-mono)}
.frac{display:inline-flex;flex-direction:column;text-align:center;max-width:100%}
.frac .num{padding:0 4px 5px;border-bottom:1.5px solid hsl(var(--foreground))}
.frac .den{padding:5px 4px 0}
.formula .op{color:hsl(var(--muted-foreground))}
.tbar{position:relative;height:8px;border-radius:4px;background:hsl(var(--border));margin:30px 6px 32px}
.zone{position:absolute;top:0;bottom:0}
.zone.red{background:hsl(var(--bad))}.zone.amber{background:hsl(var(--warn))}.zone.green{background:hsl(var(--good))}
.zone:first-child{border-radius:4px 0 0 4px}.zone:last-child{border-radius:0 4px 4px 0}
.mark{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}
.mark.base{border-radius:50%;background:hsl(var(--card));border:2.5px solid hsl(var(--foreground))}
.mark.tgt{width:12px;height:12px;background:hsl(var(--foreground));border:2px solid hsl(var(--card));transform:translate(-50%,-50%) rotate(45deg)}
.mlabel{position:absolute;font:500 11px/1 var(--font-mono);white-space:nowrap;transform:translateX(-50%)}
.mlabel.l{transform:none}.mlabel.r{transform:translateX(-100%)}
.mlabel.above{bottom:16px}.mlabel.below{top:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:11.5px/1.4 var(--font-mono);color:hsl(var(--muted-foreground))}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.ac{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr)) 34px;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid hsl(var(--border))}
.ac .tag{align-self:center}
.ac .part span{display:block;font:500 var(--text-xs)/1 var(--font-sans);text-transform:uppercase;letter-spacing:var(--tracking-wider);color:hsl(var(--muted-foreground));margin-bottom:5px}
@media (max-width:760px){.ac{grid-template-columns:minmax(0,1fr) 34px}.ac .part{grid-column:1}}
.tablewrap{overflow-x:auto}
.admin-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.admin-tools select{width:auto;max-width:100%}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:hsl(var(--foreground));color:hsl(var(--background));padding:10px 16px;border-radius:var(--radius-sm);font-size:var(--text-sm);display:flex;gap:14px;align-items:center;z-index:10;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
.paper .scorecard td:nth-child(2){white-space:nowrap}
.paper .scorecard td:nth-child(3){min-width:190px}
#toast button{border:0;background:none;color:hsl(var(--background));font-weight:600;text-decoration:underline;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
}
.download{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;border:1px solid hsl(var(--primary)/.35);background:hsl(var(--primary)/.06);border-radius:var(--radius);padding:18px 20px;margin:0 0 var(--space-8)}
.download h3{margin:0 0 4px;font-size:var(--text-lg)}
.download p{margin:0;font-size:var(--text-sm);color:hsl(var(--muted-foreground))}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="left">
      <span class="brand">Tutto<span class="dot">.</span></span>
      <span class="meta">Praxis · Agent scorecard</span>
    </div>
    <div class="right">
      <div class="startfrom"><label for="ex-select">Start from</label><select id="ex-select"></select></div>
      <div class="seg" role="group" id="view-seg" aria-label="View">
        <button data-act="view" data-view="employee" aria-pressed="true">Employee view</button>
        <button data-act="view" data-view="admin" aria-pressed="false">Admin view</button>
      </div>
    </div>
  </header>
  <section class="hero" id="hero"></section>
  <div class="layout" id="layout">
    <nav class="rail" aria-label="Steps"><ol id="nav"></ol></nav>
    <main id="panel" class="panel" aria-live="polite"></main>
    <aside class="aside" id="aside"></aside>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
/* ---------- reference data ---------- */
const STEPS=[
  {id:'role',title:'The role'},
  {id:'great',title:'What great looks like'},
  {id:'scorecard',title:'The scorecard'},
  {id:'rules',title:'House rules'},
  {id:'checkin',title:'When to check in'},
  {id:'reviews',title:'Reviews'},
  {id:'pack',title:'Your agent pack'}
];
const TRACKS={marketing:'Brand and marketing',ops:'Operations',general:'Something else',coding:'Software engineering',research:'Research and analysis',support:'Customer support'};
const EMP_TRACKS=['marketing','ops','general'];
const LADDER=[
  ['L1','Helps when I ask','It suggests. I do the work.','Only act when I ask. Suggest, don’t do.'],

/* Green = target; red = today's level if worse, else a step back from target. Admin edits switch this off. */
function deriveThresholds(k){
  if(k.autoThresholds===false)return;
  const t=num(k.target),b=num(k.baseline);
  if(!isFinite(t)){k.green='';k.red='';return;}
  const hi=k.direction==='higher';
  const scale=k.unit==='%'?100:Math.max(Math.abs(t),isFinite(b)?Math.abs(b):0,1);
  let r;
  if(hi)r=(isFinite(b)&&b<t)?b:Math.max(0,t-0.2*scale);
  else r=(isFinite(b)&&b>t)?b:(k.unit==='count'?t+1:t+0.2*scale);
  if(k.unit==='%')r=Math.min(100,Math.max(0,r));
  k.green=String(round(t));k.red=String(round(r));
}

const VAGUE=/\b(good|better|best|proper(ly)?|quality|fast(er)?|efficient(ly)?|nice|robust|optimal|well|improve[ds]?|great|seamless(ly)?)\b/i;
function lint(s){
  const issues=[];let total=0,passed=0;
  const chk=(ok,sev,step,msg,fix,kpi)=>{const w=sev==='block'?3:1;total+=w;if(ok)passed+=w;else issues.push({sev,step,msg,fix,kpi});};
  const o=s.objective;
  chk(o.statement.trim().length>=20,'block','objective','Objective is missing or too short.','One sentence: what changes, for whom, measured by what.');
  chk(!(VAGUE.test(o.statement)&&!/\d/.test(o.statement)),'warn','objective','Objective uses vague words and no number.','Add “as measured by …” with at least one figure (OKR form).');
  chk(s.meta.name.trim(),'warn','objective','Contract has no name.','Name it after the agent and the job.');
  const ac=s.done.filter(d=>(d.given+d.when+d.then).trim());
  chk(ac.length>=3,ac.length?'warn':'block','done',ac.length?`Only ${ac.length} acceptance criteri${ac.length===1?'on':'a'}.`:'No acceptance criteria.','Aim for 3–7 checks two reviewers would grade the same way.');
  chk(ac.length<=7,'warn','done','More than 7 acceptance criteria.','Split the contract, or move detail into constraints.');
  chk(ac.every(d=>d.then.trim()),'warn','done','A criterion has no Then.','Given and When default to “a request” / “the agent hands back work”; the Then is the check.');
  chk(s.grading.outcome||s.grading.artifact,'warn','done','Only the trajectory is graded.','Grade the outcome first; there is usually more than one valid path.');
  const ks=s.kpis;const ids=ks.map(k=>(k.id||'').trim());
  chk(ks.length>0,'block','kpis','No KPIs defined.','Add at least one outcome KPI from the catalogue.');
  if(ks.length){
    chk(ks.some(k=>k.dimension==='outcome'),'block','kpis','No outcome KPI.','Add task success, first-pass acceptance or similar.');
    chk(ks.some(k=>k.dimension==='efficiency'),'warn','kpis','Nothing measures cost or speed.','Add cost per successful task or time to complete.');
    chk(ks.some(k=>k.indicator==='leading'),'warn','kpis','Every KPI is lagging.','Add a leading indicator (verified claims, tool errors) to catch problems early.');
    chk(ks.length<=10,'warn','kpis','More than 10 KPIs.','Keep the vital few; move the rest to diagnostics.');
    chk(new Set(ids).size===ids.length&&ids.every(Boolean),'block','kpis','KPI IDs are missing or duplicated.','Give every KPI a unique snake_case ID.');
    ks.forEach((k,i)=>{
      const n=k.name||`KPI ${i+1}`;const ratio=['%','ratio','$'].includes(k.unit);
      chk(k.numerator.trim()&&(!ratio||k.denominator.trim()),'block','kpis',`${n}: formula incomplete.`,'State the numerator and the denominator.',i);
      chk(k.dataSource.trim(),'block','kpis',`${n}: no data source.`,'Say where the numbers come from (state.db, test log, survey).',i);
      const t=num(k.target),g=num(k.green),r=num(k.red),b=num(k.baseline);
      chk(isFinite(t),'block','kpis',`${n}: no target.`,'Set the value to reach and the date.',i);
      chk(isFinite(g)&&isFinite(r),'warn','kpis',`${n}: thresholds not set.`,'Set green and red; amber is the band between.',i);
      if(isFinite(g)&&isFinite(r))chk(k.direction==='higher'?g>r:g<r,'block','kpis',`${n}: thresholds run the wrong way.`,k.direction==='higher'?'Higher is better, so green must sit above red.':'Lower is better, so green must sit below red.',i);
      if(k.dimension!=='safety'){
        chk(isFinite(b),'warn','kpis',`${n}: no baseline.`,'Measure today’s level first, e.g. a pilot of 20–50 real tasks.',i);
        if(!isFinite(b)&&k.unit==='%'&&k.direction==='higher'&&t>=99)chk(false,'warn','kpis',`${n}: ${t}% target with no baseline.`,'Near-perfect targets need evidence they are reachable.',i);
        chk(k.counter&&ids.includes(k.counter),'warn','guardrails',`${n}: no counter-metric.`,'Pair it with a KPI that exposes gaming (Goodhart’s law).',i);
      }
      chk(k.owner.trim(),'warn','kpis',`${n}: no owner.`,'Name who acts when it goes red.',i);
      chk(k.breach.trim(),'warn','kpis',`${n}: no breach action.`,'Decide now what red triggers: alert, pause, roll back.',i);
      if(k.grader==='judge'){
        chk(k.rubricBinary,'warn','kpis',`${n}: judge rubric isn’t pass/fail.`,'Use binary checks, one criterion per judge.',i);
        chk(k.calibrated,'warn','kpis',`${n}: judge not calibrated.`,'Compare against human labels on 50–100 samples first.',i);
      }
      if(k.unit==='$')chk(!/attempt/i.test(k.denominator),'warn','kpis',`${n}: cost divided by attempts.`,'Divide by successful tasks so failures count as cost.',i);
    });
  }
  const cons=s.guardrails.constraints.filter(x=>x.trim()),zt=s.guardrails.zeroTolerance.filter(x=>x.trim());
  chk(cons.length||zt.length,'block','guardrails','No hard constraints.','List what the agent must never do.');
  chk(zt.length,'warn','guardrails','No zero-tolerance failures.','Name failures that fail a run whatever the score.');
  chk(ks.some(k=>k.dimension==='safety'),'warn','guardrails','No safety KPI tracks the constraints.','Add hard-constraint violations with a target of 0.');
  const r=s.run;
  chk(r.escalateWhen.some(x=>x.trim()),'warn','autonomy','No escalation triggers.','Say exactly when the agent must stop and ask.');
  chk(isFinite(num(r.maxIterations)),'warn','autonomy','No iteration limit.','Cap iterations so a stuck agent stops (Hermes default: 250).');
  if(o.customerFacing)chk(r.reliability==='pass^k'&&num(r.trials)>=3,'warn','autonomy','Customer-facing, but reliability isn’t pass^k with k ≥ 3.','Every trial must succeed when customers see the result.');
  chk(s.meta.owner.trim(),'warn','governance','Contract has no owner.','Name the person accountable for the targets.');
  chk(s.governance.reviewBy,'warn','governance','No review date.','Set the date you will revisit the targets.');
  chk(s.governance.evidence.some(x=>x.trim()),'warn','governance','No required evidence.','List the proof the agent must attach.');
  return {issues,score:total?Math.round(passed/total*100):0,blocks:issues.filter(x=>x.sev==='block').length,warns:issues.filter(x=>x.sev==='warn').length};
}

const nv=v=>{const n=num(v);return isFinite(n)?n:null;};

function yScalar(v){
  if(v===null||v===undefined||v==='')return 'null';
  if(typeof v==='number'||typeof v==='boolean')return String(v);
  const s=String(v);
  if(/^[A-Za-z][A-Za-z0-9 _.\/()^,+-]*$/.test(s)&&!/^(true|false|null|yes|no|on|off|y|n)$/i.test(s)&&!/\s$/.test(s))return s;
  return JSON.stringify(s);
}
function yObj(o,ind){return Object.entries(o).map(([k,v])=>{
  if(Array.isArray(v))return v.length?`${ind}${k}:\n${yArr(v,ind+'  ')}`:`${ind}${k}: []`;
  if(v&&typeof v==='object')return Object.keys(v).length?`${ind}${k}:\n${yObj(v,ind+'  ')}`:`${ind}${k}: {}`;
  return `${ind}${k}: ${yScalar(v)}`;}).join('\n');}
function yArr(a,ind){return a.map(x=>{
  if(x&&typeof x==='object'&&!Array.isArray(x)){const b=yObj(x,ind+'  ');return ind+'- '+b.slice(ind.length+2);}
  return `${ind}- ${yScalar(x)}`;}).join('\n');}

function toMarkdown(s){

  if(s.objective.why)L.push(`Why now: ${s.objective.why}`);
  if(s.objective.customerFacing)L.push('Customer-facing: yes');
  L.push('','## Definition of done','',c.success_rule,'');
  c.definition_of_done.forEach(a=>L.push(`- **${a.id}** Given ${a.given}, when ${a.when}, then ${a.then}.`));
  L.push('',`Graded on: ${c.grading_focus.join(', ')||'—'}`,'');
  L.push('## KPIs','','| KPI | Formula | Baseline | Target | Green | Red | Grader | Data source | Cadence | Counter |','|---|---|---|---|---|---|---|---|---|---|');
  s.kpis.forEach(k=>{const f=k.denominator?`${k.numerator} ÷ ${k.denominator}`:k.numerator;const cm=s.kpis.find(x=>x.id===k.counter);
    L.push(`| ${k.name} (\`${k.id}\`) | ${f} | ${fmtVal(k.baseline,k.unit)} | ${fmtVal(k.target,k.unit)}${k.targetBy?' by '+k.targetBy:''} | ${k.direction==='higher'?'≥':'≤'} ${fmtVal(k.green,k.unit)} | ${k.direction==='higher'?'≤':'≥'} ${fmtVal(k.red,k.unit)} | ${GRADERS[k.grader]} | ${dash(k.dataSource)} | ${k.cadence} | ${cm?cm.name:'—'} |`.replace(/\n/g,' '));});
  L.push('','### Gaming risks and actions on red','');
  s.kpis.forEach(k=>L.push(`- **${k.name}**: could be gamed by ${k.gaming||'—'}. On red: ${k.breach||'—'} (owner: ${k.owner||'—'}).`));
  L.push('','## Hard constraints','');c.guardrails.hard_constraints.forEach(x=>L.push('- '+x));
  L.push('','## Zero-tolerance failures (run fails regardless of score)','');c.guardrails.zero_tolerance.forEach(x=>L.push('- '+x));
  const rp=c.run_policy;
  L.push('','## Run policy','',`- Autonomy: ${rp.autonomy_level} ${rp.autonomy_label}`,`- Reliability: ${rp.reliability_metric}${rp.trials_k?` with k = ${rp.trials_k}`:''}`,`- Max iterations: ${rp.max_iterations??'—'}; escalate after ${rp.max_distinct_strategies??'—'} distinct strategies fail`);
  if(rp.escalate_when.length){L.push('- Stop and escalate when:');rp.escalate_when.forEach(x=>L.push('  - '+x));}
  if(rp.human_checkpoints.length){L.push('- Planned human checkpoints:');rp.human_checkpoints.forEach(x=>L.push('  - '+x));}
  L.push('','## Delivery','',`Format: ${dash(c.delivery.format)}`,'','Required evidence:');c.delivery.required_evidence.forEach(x=>L.push('- '+x));
  L.push('','## Self-check before declaring done','');
  c.definition_of_done.forEach(a=>L.push(`- [ ] ${a.id} passes, with proof attached`));
  L.push('- [ ] No hard constraint or zero-tolerance rule broken','- [ ] Evidence is real tool output, not paraphrase','- [ ] Absolute paths given for every created or changed file');
  return L.join('\n')+'\n';
}

function toInstructions(s){

function formulaHtml(k){
  const unitNote=k.unit==='%'?'× 100':k.unit==='$'?'in currency':k.unit==='ratio'?'':'';
  if(['%','ratio','$'].includes(k.unit))
    return `<span class="frac"><span class="num">${esc(k.numerator||'numerator?')}</span><span class="den">${esc(k.denominator||'denominator?')}</span></span>${unitNote?`<span class="op">${unitNote}</span>`:''}`;
  return `<span class="agg">${esc(k.numerator||'measure?')}</span><span class="op">across</span><span class="agg">${esc(k.denominator||'—')}</span><span class="op">in ${esc(k.unit)}</span>`;

function scaleHtml(k){
  const g=num(k.green),r=num(k.red),b=num(k.baseline),t=num(k.target);
  if(!isFinite(g)||!isFinite(r))return `<div class="scale-empty">Set green and red thresholds to draw the scale.</div>`;
  const vals=[g,r,b,t].filter(isFinite);
  let lo=Math.min(0,...vals),hi=k.unit==='%'?Math.max(100,...vals):Math.max(...vals)*1.3;
  if(hi<=lo)hi=lo+1;
  const pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  const hiBetter=k.direction==='higher';
  const z=hiBetter?[['red',lo,r],['amber',r,g],['green',g,hi]]:[['green',lo,g],['amber',g,r],['red',r,hi]];
  const zones=z.filter(([,a,c])=>c>a).map(([cls,a,c])=>`<span class="zone ${cls}" style="left:${pos(a)}%;width:${pos(c)-pos(a)}%"></span>`).join('');
  const lab=(v,cls,text)=>{const p=pos(v);const side=p<12?' l':p>88?' r':'';return `<span class="mlabel ${cls}${side}" style="left:${p}%">${text}</span>`;};
  let marks='';
  if(isFinite(b))marks+=`<span class="mark base" style="left:${pos(b)}%" title="Baseline"></span>`+lab(b,'below','baseline '+fmtVal(b,k.unit));
  if(isFinite(t))marks+=`<span class="mark tgt" style="left:${pos(t)}%" title="Target"></span>`+lab(t,'above','target '+fmtVal(t,k.unit));
  const gs=hiBetter?'≥':'≤',rs=hiBetter?'≤':'≥';
  return `<div class="tbar">${zones}${marks}</div><div class="legend"><span><i style="background:var(--good)"></i>green ${gs} ${fmtVal(g,k.unit)}</span><span><i style="background:var(--warn)"></i>amber between</span><span><i style="background:var(--bad)"></i>red ${rs} ${fmtVal(r,k.unit)}</span></div>`;
}

  return `<h2>The contract behind the scorecard</h2>
  <p class="lead">Everything the employee answered, translated into measurable fields. Edit here to tune formulas, graders, thresholds and the run policy. Employees never see this view.</p>
  ${sec('map','01','How answers map',`<div class="tablewrap"><table><thead><tr><th>Employee sees</th><th>Contract field</th><th>Meaning</th></tr></thead><tbody>${MAP_ROWS.map(r=>`<tr><td>${esc(r[0])}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`)}
  ${sec('done','02','Success criteria',`<p class="text-muted" style="font-size:var(--text-sm)">A run succeeds only if every criterion passes and no deal-breaker occurs. Empty Given/When fall back to defaults in the exports.</p>
    <div class="list">${S.done.map((d,i)=>`<div class="ac"><span class="tag tag-primary">AC${i+1}</span>
      <label class="part"><span>Given</span><textarea rows="2" id="f-done-${i}-given" data-bind="done.${i}.given" placeholder="a request within the agent’s job">${esc(d.given)}</textarea></label>
      <label class="part"><span>When</span><textarea rows="2" id="f-done-${i}-when" data-bind="done.${i}.when" placeholder="the agent hands back its work">${esc(d.when)}</textarea></label>
      <label class="part"><span>Then</span><textarea rows="2" id="f-done-${i}-then-a" data-bind="done.${i}.then">${esc(d.then)}</textarea></label>
      <button class="icon-btn" data-act="del-done" data-i="${i}" aria-label="Remove AC${i+1}">×</button></div>`).join('')}
    <button class="add-btn" data-act="add-done">+ Add criterion</button></div>
    <div class="grid2" style="margin-top:18px">${cbx('grading.outcome','Grade the outcome','End state: tests pass, ticket resolved')}${cbx('grading.artifact','Grade the artifact','The deliverable itself')}${cbx('grading.trajectory','Grade the trajectory','Tool choice and order; only where the path matters')}</div>`)}
  ${sec('kpis','03','KPIs',`<div class="admin-tools"><select id="cat-select" aria-label="KPI catalogue"><option value="">Add from catalogue…</option>${groups}</select><button class="btn btn-ghost btn-sm" data-act="add-cat">Add</button><button class="btn btn-ghost btn-sm" data-act="add-kpi">Blank KPI</button></div>
    ${S.kpis.length?S.kpis.map(kpiCard).join(''):'<p class="text-muted">No KPIs yet.</p>'}`)}
  ${sec('policy','04','Run policy',`<div class="grid2">
    ${inp('meta.agent','Agent runtime',{ph:'e.g. Hermes delegate_task child'})}
    ${sel('meta.track','Track',Object.entries(TRACKS))}
    ${sel('run.autonomy','Autonomy level',AUTONOMY.map(([v,t,d])=>[v,`${v} ${t}: ${d}`]))}
    ${sel('run.reliability','Reliability metric',RELIABILITY)}
    ${inp('run.trials','Trials per task (k)',{mode:'numeric'})}
    ${inp('run.maxIterations','Max iterations per run',{mode:'numeric',hint:'Hermes default is 250.'})}
    ${inp('run.strategies','Distinct strategies before escalating',{mode:'numeric'})}
    ${inp('meta.version','Contract version')}
    <div class="field wide">${cbx('objective.customerFacing','Customer-facing output','Use pass^k with k ≥ 3.')}</div>
    <div class="field"><span class="lbl">Escalate when</span>${listEd('run.escalateWhen','Trigger')}</div>
    <div class="field"><span class="lbl">Human checkpoints</span>${listEd('run.checkpoints','Checkpoint')}</div></div>`)}
  ${sec('exports','05','Exports',`<div class="tabs" role="tablist">${Object.entries(EXPORTS).map(([k,v])=>`<button role="tab" aria-selected="${expTab===k}" data-act="tab" data-tab="${k}">${v.label}</button>`).join('')}</div><div id="export-body"></div>`)}`;
}
function renderExportBody(){
  const el=$('#export-body');if(!el)return;const e=EXPORTS[expTab];
  el.innerHTML=`<div class="out-bar"><p>${e.how[0]}</p><div class="btns"><button class="btn btn-primary btn-sm" data-act="copy">Copy ${esc(e.label)}</button></div></div><pre class="code nowrap" id="export-code" tabindex="0"></pre>${e.how.length>1?`<ul class="dash" style="margin-top:14px;font-size:var(--text-sm)">${e.how.slice(1).map(h=>`<li>${h}</li>`).join('')}</ul>`:''}`;
  $('#export-code').textContent=e.make(S);
}

/* ---------- chrome ---------- */
let lastLint=null,lastHealth=null;
function renderHero(){
  $('#hero').innerHTML=view==='employee'
    ?`<span class="eyebrow">Hire your first agent</span><h1>Set it up like a new starter.<br><em>Know when it’s doing well.</em></h1><p class="lead">Seven short steps, no technical knowledge needed. You finish with a brief for your team, instructions to paste into your agent, and a scorecard to fill in each week.</p>${S.meta.sample?`<div class="admin-banner"><span class="tag tag-primary">Example</span><span>You are looking at a worked example. Change anything, or choose a blank role from “Start from”.</span></div>`:''}`
    :`<span class="eyebrow">Admin view</span><h1>The measurable contract.<br><em>Under the covers.</em></h1><p class="lead">Formulas, graders, thresholds, reliability and exports for Hermes. Same contract as the employee view, edited in either place.</p>`;
  const opts=view==='employee'?[['social','Example: social post drafter'],['reporter','Example: weekly campaign reporter'],['supplier','Example: supplier follow-up assistant'],['blank','A blank role']]
    :[['social','Example: social post drafter'],['reporter','Example: weekly campaign reporter'],['supplier','Example: supplier follow-up'],['coding','Example: coding subagent'],['research','Example: research subagent'],['support','Example: support agent'],['blank','Blank contract']];
  $('#ex-select').innerHTML=`<option value="">Choose…</option>`+opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
}
function renderNav(){
  if(view==='employee'){
    const H=lastHealth;
    $('#nav').innerHTML=STEPS.map((st,i)=>{const mine=H.items.filter(x=>x.step===st.id&&!x.soft);const ok=mine.length&&mine.every(x=>x.ok);
      return `<li><button data-act="goto" data-step="${i}"${i===cur?' aria-current="step"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${st.title}</span>${st.id==='pack'?'':`<span class="ok${ok?' on':''}" title="${ok?'Done':'Still to do'}"></span>`}</button></li>`;}).join('');
  }else{
    $('#nav').innerHTML=ADMIN.map(([id,l],i)=>`<li><button data-act="adm-goto" data-sec="${id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${l}</span></button></li>`).join('');
  }
}
function renderAside(){
  if(view==='employee'){
    const H=lastHealth;
    $('#aside').innerHTML=`<div class="card"><span class="eyebrow">Brief strength</span><div class="strength"><b>${H.label}</b><span>${H.done} of ${H.total}</span></div>
      <div class="meter" style="grid-template-columns:repeat(${H.total},1fr)">${Array.from({length:H.total},(_,i)=>`<i class="${i<H.done?'on':''}"></i>`).join('')}</div>
      <ul class="todo">${H.items.map((x,j)=>`<li><button class="${x.ok?'done':''}${x.soft?' soft':''}" data-act="hitem" data-j="${j}"><span class="mk"></span><span>${esc(x.text)}${x.soft&&!x.ok?'<em>Optional, but it makes the targets realistic.</em>':''}</span></button></li>`).join('')}</ul></div>`;
  }else{
    const L=lastLint,covered=new Set(S.kpis.map(k=>k.dimension));
    $('#aside').innerHTML=`<div class="card"><span class="eyebrow">Contract checks</span><div class="strength"><b>${L.score}%</b><span class="pill ${L.blocks?'bad':L.warns?'warn':'good'}">${L.blocks?`${L.blocks} blocking`:L.warns?`${L.warns} to review`:'Clean'}</span></div>
      <div class="meter" style="grid-template-columns:repeat(20,1fr)">${Array.from({length:20},(_,i)=>`<i class="${i<Math.round(L.score/5)?'on':''}"></i>`).join('')}</div>
      ${L.issues.length?`<ul class="todo issues">${L.issues.map((x,j)=>`<li><button data-act="issue" data-j="${j}"><span class="mk ${x.sev}"></span><span>${esc(x.msg)}<em>${esc(x.fix)}</em></span></button></li>`).join('')}</ul>`:'<p class="text-muted" style="font-size:var(--text-sm)">Nothing flagged.</p>'}</div>
      <div class="card"><h3>Dimension coverage</h3><div class="chips">${Object.entries(DIMENSIONS).map(([d,v])=>`<span class="tag${covered.has(d)?' tag-primary':''}" title="${esc(v.map)}">${v.label}</span>`).join('')}</div></div>`;
  }
}
function updateLive(){
  S.kpis.forEach(deriveThresholds);
  lastHealth=plainHealth(S);lastLint=lint(S);
  renderNav();renderAside();
  if(view==='admin'){$$('.kpi[data-kpi]').forEach(el=>updateKpi(el,lastLint));renderExportBody();}
  else if(STEPS[cur].id==='pack')renderPackBody();
  save();
}
function renderPanel(){
  if(view==='admin'){$('#panel').innerHTML=adminHtml();return;}
  const st=STEPS[cur];
  $('#panel').innerHTML=E[st.id]()+`<div class="panel-foot">${cur>0?`<button class="btn btn-ghost" data-act="prev">Back: ${STEPS[cur-1].title}</button>`:'<span></span>'}${cur<STEPS.length-1?`<button class="btn btn-primary" data-act="next">Next: ${STEPS[cur+1].title}</button>`:''}</div>`;
}
function render(){S.kpis.forEach(deriveThresholds);renderHero();renderPanel();updateLive();}
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();$('#layout').scrollIntoView({block:'start',behavior:smooth()});}
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},undo?7000:2600);}
function loadState(next,msg){undoState={S:clone(S),cur};S=next;openCards.clear();cur=0;render();toast(msg,true);}
function scrollToKpi(k){requestAnimationFrame(()=>{const el=$(`.kpi[data-uid="${k.uid}"]`);if(el)el.scrollIntoView({block:'start',behavior:smooth()});});}
async function copyText(txt,label){
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){
    try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();}catch(e2){}}
  toast(ok?`Copied ${label}.`:'Your browser blocked copying here. Select the text and copy it by hand.');
}

/* ---------- events ---------- */
function onField(e){
  const t=e.target,p=t.dataset&&t.dataset.bind;if(!p)return false;
  if(t.type==='radio'&&!t.checked)return false;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.scale&&v!=='')v=String(round(num(v)*num(t.dataset.scale)));
  setPath(S,p,v);
  const m=p.match(/^kpis\.(\d+)\.(green|red)$/);if(m)S.kpis[+m[1]].autoThresholds=false;
  if(S.meta.sample&&/^(objective|meta\.name)/.test(p))S.meta.sample=false,renderHero();
  updateLive();return true;
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{
  if(e.target.id==='ex-select'){const v=e.target.value;e.target.value='';if(!v)return;
    loadState(v==='blank'?blank():example(v),v==='blank'?'Started a blank role.':'Loaded the example. Replace anything with your own.');return;}
  const p=e.target.dataset&&e.target.dataset.bind;if(!p)return;
  onField(e);
  if(view==='employee'&&(/^kpis\./.test(p)||p==='meta.track')&&e.target.tagName==='SELECT')render();
  if(view==='admin'&&(/\.id$/.test(p)||p==='meta.track'))render();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('kpi'))d.open?openCards.add(d.dataset.uid):openCards.delete(d.dataset.uid);},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='view'){view=b.dataset.view;render();}
  else if(a==='goto')go(+b.dataset.step);
  else if(a==='next')go(cur+1);
  else if(a==='prev')go(cur-1);
  else if(a==='adm-goto')$('#adm-'+b.dataset.sec)?.scrollIntoView({block:'start',behavior:smooth()});
  else if(a==='add-list'){getPath(S,b.dataset.path).push('');render();$('#'+pid(b.dataset.path)+'-'+(getPath(S,b.dataset.path).length-1))?.focus();}
  else if(a==='del-list'){const arr=getPath(S,b.dataset.path);arr.splice(+b.dataset.i,1);if(!arr.length)arr.push('');render();}
  else if(a==='preset'){const arr=getPath(S,b.dataset.path);const i=arr.findIndex(x=>!x.trim());i>=0?arr[i]=b.dataset.val:arr.push(b.dataset.val);render();}
  else if(a==='add-done'){S.done.push({given:'',when:'',then:''});render();$(`#f-done-${S.done.length-1}-then`)?.focus();}
  else if(a==='del-done'){S.done.splice(+b.dataset.i,1);if(!S.done.length)S.done.push({given:'',when:'',then:''});render();}
  else if(a==='goal'){const id=b.dataset.id;const i=S.kpis.findIndex(k=>k.id===id);
    if(i>=0){undoState={S:clone(S),cur};S.kpis.splice(i,1);S.kpis.forEach(k=>{if(k.counter===id)k.counter='';});render();toast(`Removed “${PLAIN[id]?.label||id}”.`,true);}
    else{const k=fromCat(id,{owner:S.meta.owner});const have=new Set(S.kpis.map(o=>o.id));
      S.kpis.forEach(o=>{if(PLAIN[o.id]?.pair===id&&!(o.counter&&have.has(o.counter)))o.counter=id;});
      if(PLAIN[id]?.pair&&have.has(PLAIN[id].pair))k.counter=PLAIN[id].pair;S.kpis.push(k);render();}}
  else if(a==='pack'){packTab=b.dataset.tab;render();}
  else if(a==='download')downloadPdf(b);
  else if(a==='print'){toast('Opening print. If nothing appears, your browser blocked it here: use Copy instead.');setTimeout(()=>{try{window.print();}catch(err){}},50);}
  else if(a==='copy-pack')copyText(packTab==='instructions'?toInstructions(S):packText(),({brief:'the brief',instructions:'the instructions',scorecard:'the scorecard'})[packTab]);
  else if(a==='tab'){expTab=b.dataset.tab;renderExportBody();$$('[data-act="tab"]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===expTab)));save();}
  else if(a==='copy')copyText(EXPORTS[expTab].make(S),EXPORTS[expTab].label);
  else if(a==='add-cat'){const v=$('#cat-select').value;if(!v){toast('Choose a KPI from the catalogue first.');return;}
    const k=fromCat(v,{owner:S.meta.owner});if(S.kpis.some(x=>x.id===k.id))k.id=k.id+'_'+(S.kpis.length+1);S.kpis.push(k);openCards.add(k.uid);render();scrollToKpi(k);}
  else if(a==='add-kpi'){const k=blankKpi(S.kpis.length+1);S.kpis.push(k);openCards.add(k.uid);render();scrollToKpi(k);}
  else if(a==='dup-kpi'){const k=clone(S.kpis[+b.dataset.i]);k.uid=uid();k.id=k.id+'_copy';k.name=k.name+' (copy)';S.kpis.splice(+b.dataset.i+1,0,k);openCards.add(k.uid);render();}
  else if(a==='del-kpi'){undoState={S:clone(S),cur};const gone=S.kpis.splice(+b.dataset.i,1)[0];S.kpis.forEach(k=>{if(k.counter===gone.id)k.counter='';});render();toast(`Removed ${gone.name||'KPI'}.`,true);}
  else if(a==='issue'){const x=lastLint.issues[+b.dataset.j];if(!x)return;
    if(x.kpi!=null&&S.kpis[x.kpi]){const k=S.kpis[x.kpi];openCards.add(k.uid);render();scrollToKpi(k);}
    else if(['objective','governance','guardrails'].includes(x.step)){view='employee';go(STEPS.findIndex(s=>s.id===({objective:'role',governance:'reviews',guardrails:'rules'})[x.step]));}
    else $('#adm-'+({done:'done',kpis:'kpis',autonomy:'policy'})[x.step])?.scrollIntoView({block:'start',behavior:smooth()});}
  else if(a==='hitem'){const x=lastHealth.items[+b.dataset.j];if(x)go(STEPS.findIndex(s=>s.id===x.step));}
  else if(a==='undo'&&undoState){S=undoState.S;cur=undoState.cur;undoState=null;render();$('#toast').hidden=true;}
});

/* ---------- boot ---------- */
(function boot(){
  const d=restore();
  if(d){S=d.S;cur=Math.min(d.cur||0,STEPS.length-1);view=d.view==='admin'?'admin':'employee';packTab=d.packTab||'brief';expTab=d.expTab||'md';}
  else S=example('social');
  render();
})();
</script>

</body></html>
