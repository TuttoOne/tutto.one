<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Write down how you use AI, for your organisation or just for yourself, and finish with a charter you can download and come back to.">
<title>AI Charter · Tutto</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/ai-charter/assets/praxis.css">
<link rel="stylesheet" href="/ai-charter/assets/app.css">
<script src="/praxis-data.js" data-tool="ai-charter" data-key="praxis_charter_v2" data-label="the AI charter"></script>
</head>
<body>
<a class="skip-link" href="#panel">Skip to content</a>
<div class="shell">
  <header class="topbar">
    <div class="left">
      <span class="brand">Tutto<span class="dot">.</span></span>
      <span class="meta">Praxis · AI charter</span>
    </div>
    <div class="right">
      <div class="seg" role="group" id="mode-seg" aria-label="Who the charter is for">
        <button type="button" data-mode="org" aria-pressed="true">Organisation</button>
        <button type="button" data-mode="me" aria-pressed="false">Just me</button>
      </div>
    </div>
  </header>
  <section class="hero" id="hero"></section>
  <div class="layout" id="layout">
    <nav class="rail" aria-label="Steps"><ol id="nav"></ol></nav>
    <main id="panel" class="panel" tabindex="-1"></main>
    <aside class="aside" id="aside"></aside>
  </div>
  <p class="credit" id="credit"></p>
</div>
<div id="toast" role="status" hidden></div>
<div id="print-root" class="print-root paper" aria-hidden="true"></div>

<script type="module" src="/ai-charter/js/app.js"></script>
</body>
</html>
