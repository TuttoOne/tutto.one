<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 242" role="img" aria-label="The folder is the boundary"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Three setup choices</text><rect x="20" y="34" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="57" r="11" class="s-amber"/><text x="44" y="61" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">1</text><text x="66" y="54" class="t-lbl">The folder</text><text x="66" y="70" class="t-sub">everything it can touch</text><rect x="20" y="88" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="111" r="11" class="s-amber"/><text x="44" y="115" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">2</text><text x="66" y="108" class="t-lbl">Connectors</text><text x="66" y="124" class="t-sub">which apps it reaches</text><rect x="20" y="142" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="165" r="11" class="s-amber"/><text x="44" y="169" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">3</text><text x="66" y="162" class="t-lbl">How closely it asks</text><text x="66" y="178" class="t-sub">your comfort setting</text><rect x="20" y="202" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="227" text-anchor="middle" class="t-white">The folder is the one that bounds it</text></svg>