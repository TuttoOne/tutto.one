<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 162" role="img" aria-label="One question decides it"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="10" y="0" width="320" height="40" rx="8" class="box"/><text x="170" y="25" text-anchor="middle" class="t-lbl">does the middle matter to you?</text><rect x="0" y="54" width="140" height="54" rx="8" class="box"/><text x="70" y="76" text-anchor="middle" class="t-lbl">no</text><text x="70" y="94" text-anchor="middle" class="t-sub">send it away</text><rect x="200" y="54" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="76" text-anchor="middle" class="t-lbl">yes</text><text x="270" y="94" text-anchor="middle" class="t-sub">keep it in the thread</text><path d="M144,72 L194,72" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="122" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="147" text-anchor="middle" class="t-white">Fresh eyes critique more freely</text></svg>