<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Claude writes the subagent for you"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">/agents</text><text x="170" y="40" text-anchor="middle" class="t-sub">describe what you want</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="90" width="300" height="34" rx="8" class="box"/><text x="38" y="112" class="t-lbl">a name and description</text><rect x="20" y="132" width="300" height="34" rx="8" class="box"/><text x="38" y="154" class="t-lbl">the tools it can touch</text><rect x="20" y="174" width="300" height="34" rx="8" class="box"/><text x="38" y="196" class="t-lbl">a plain-English system prompt</text><text x="170" y="234" text-anchor="middle" class="t-sub">Say "proactively" and it delegates unasked.</text></svg>