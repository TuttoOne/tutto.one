<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img" aria-label="What this does not give you"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="34" rx="8" class="box"/><text x="38" y="22" class="t-lbl">a result for other documents</text><rect x="20" y="42" width="300" height="34" rx="8" class="box"/><text x="38" y="64" class="t-lbl">anything you did not specify</text><rect x="20" y="84" width="300" height="34" rx="8" class="box"/><text x="38" y="106" class="t-lbl">a reason to stop looking</text><rect x="20" y="132" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="154" text-anchor="middle" class="t-white">A number you trust too much is worse</text><text x="170" y="172" text-anchor="middle" class="t-white">than none</text></svg>