<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" role="img" aria-label="Four real agreements, not a sample"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="10" y="0" width="320" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">four managed-services agreements</text><text x="170" y="40" text-anchor="middle" class="t-sub">twenty to thirty pages each</text><text x="170" y="80" text-anchor="middle" class="t-sub">Law, accounting, financial services, personal injury.</text><rect x="20" y="100" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="125" text-anchor="middle" class="t-white">A rate needs more than one case</text></svg>