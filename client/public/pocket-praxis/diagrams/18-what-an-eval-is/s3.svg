<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="A demo, against a rate"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">What most people do</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Read one output.</text><text x="170" y="58" text-anchor="middle" class="t-sub">Decide it looks about right.</text><path d="M170,80 L170,96" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="102" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="122" text-anchor="middle" class="t-band">What an eval does</text><text x="170" y="142" text-anchor="middle" class="t-lbl">Runs a fixed set. Scores it.</text><text x="170" y="160" text-anchor="middle" class="t-sub">Gives you a rate to compare.</text><rect x="20" y="182" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="204" text-anchor="middle" class="t-white">A scorecard for what you cannot</text><text x="170" y="222" text-anchor="middle" class="t-white">unit-test</text></svg>