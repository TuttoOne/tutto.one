<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 102" role="img" aria-label="Two halves, built by hand"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">this session</text><text x="70" y="40" text-anchor="middle" class="t-sub">the map</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">the workshop</text><text x="270" y="40" text-anchor="middle" class="t-sub">one built end to end</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="170" y="80" text-anchor="middle" class="t-sub">The hard part is a domain judgement, not a technical</text><text x="170" y="96" text-anchor="middle" class="t-sub">one.</text></svg>