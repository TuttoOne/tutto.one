<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 234" role="img" aria-label="Where the line sits"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Tests</text><text x="170" y="40" text-anchor="middle" class="t-lbl">The parts with one right answer.</text><text x="170" y="58" text-anchor="middle" class="t-sub">Did it parse? Did it save?</text><line x1="20" y1="80" x2="320" y2="80" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><rect x="20" y="96" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="116" text-anchor="middle" class="t-band">Evals</text><text x="170" y="136" text-anchor="middle" class="t-lbl">The parts that take judgement.</text><text x="170" y="154" text-anchor="middle" class="t-sub">Is this the right answer?</text><rect x="20" y="176" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="198" text-anchor="middle" class="t-white">Most confusion is reaching for the wrong</text><text x="170" y="216" text-anchor="middle" class="t-white">side</text></svg>