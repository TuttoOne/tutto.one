<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" role="img" aria-label="Two awarenesses make one decision"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">Problem</text><text x="70" y="40" text-anchor="middle" class="t-sub">your goal, the work</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">Platform</text><text x="270" y="40" text-anchor="middle" class="t-sub">what this AI can do</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="50" y="90" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="112" text-anchor="middle" class="t-lbl">task delegation</text><text x="170" y="130" text-anchor="middle" class="t-sub">split to each side's strengths</text><text x="170" y="170" text-anchor="middle" class="t-sub">Hand over the volume. Keep the judgement.</text></svg>