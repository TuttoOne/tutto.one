<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 316" role="img" aria-label="Six moves, and the one people forget"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="34" rx="8" class="box"/><text x="38" y="22" class="t-lbl">give context</text><rect x="20" y="42" width="300" height="34" rx="8" class="box"/><text x="38" y="64" class="t-lbl">show examples</text><rect x="20" y="84" width="300" height="34" rx="8" class="box"/><text x="38" y="106" class="t-lbl">specify constraints</text><rect x="20" y="126" width="300" height="34" rx="8" class="box"/><text x="38" y="148" class="t-lbl">break into steps</text><rect x="20" y="168" width="300" height="34" rx="8" class="box"/><text x="38" y="190" class="t-lbl">ask it to think first</text><rect x="20" y="210" width="300" height="34" rx="8" class="box"/><text x="38" y="232" class="t-lbl">define role and tone</text><rect x="20" y="258" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="280" text-anchor="middle" class="t-white">Then hand it your prompt and ask it to</text><text x="170" y="298" text-anchor="middle" class="t-white">improve it</text></svg>