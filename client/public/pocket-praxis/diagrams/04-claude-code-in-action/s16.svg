<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 178" role="img" aria-label="The same agent, inside your own software"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">Claude Code</text><text x="170" y="40" text-anchor="middle" class="t-sub">loop, tools, context, permissions</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="82" class="t-sub">the SDK</text><rect x="50" y="90" width="240" height="40" rx="8" class="box-amber"/><text x="170" y="115" text-anchor="middle" class="t-lbl">a component you build with</text><text x="170" y="156" text-anchor="middle" class="t-sub">The ceiling. The workflow you build by hand can later</text><text x="170" y="172" text-anchor="middle" class="t-sub">run itself.</text></svg>