<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 216" role="img" aria-label="A request, against a guarantee"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">A prompt</text><text x="170" y="40" text-anchor="middle" class="t-lbl">"Always run the formatter."</text><text x="170" y="58" text-anchor="middle" class="t-sub">Usually honoured. Sometimes missed.</text><line x1="20" y1="80" x2="320" y2="80" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><rect x="20" y="96" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="116" text-anchor="middle" class="t-band">A hook</text><text x="170" y="136" text-anchor="middle" class="t-lbl">Runs every time,</text><text x="170" y="154" text-anchor="middle" class="t-sub">at a fixed point.</text><rect x="20" y="176" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="201" text-anchor="middle" class="t-white">Probabilistic, against guaranteed</text></svg>