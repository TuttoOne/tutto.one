<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 192" role="img" aria-label="Sharing hooks across machines"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">absolute paths</text><text x="170" y="40" text-anchor="middle" class="t-sub">recommended, for security</text><path d="M170,68 L170,84" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><text x="180" y="82" class="t-sub">but your path is not mine</text><rect x="50" y="90" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="112" text-anchor="middle" class="t-lbl">an example settings file</text><text x="170" y="130" text-anchor="middle" class="t-sub">a placeholder the setup fills in</text><text x="170" y="170" text-anchor="middle" class="t-sub">Set up once, by a trainer or a developer. The team</text><text x="170" y="186" text-anchor="middle" class="t-sub">inherits it.</text></svg>