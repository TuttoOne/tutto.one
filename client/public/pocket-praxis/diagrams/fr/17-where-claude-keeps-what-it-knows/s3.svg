<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 226" role="img" aria-label="Trois mémoires, toutes des fichiers"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">Vos instructions</text><text x="38" y="36" class="t-sub">écrites par vous</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">Procédures</text><text x="38" y="90" class="t-sub">écrites par vous, chargées si ça correspond</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">Mémoire de session</text><text x="38" y="144" class="t-sub">écrite par Claude, par dépôt</text><rect x="20" y="168" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="190" text-anchor="middle" class="t-white">Pas de base de données. Du texte brut sur votre</text><text x="170" y="208" text-anchor="middle" class="t-white">machine.</text></svg>