<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 98" role="img" aria-label="Un vrai dossier, pas une illustration"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="20" text-anchor="middle" class="t-band">Ce qui s’y trouve vraiment</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Un portable qui sert,</text><text x="170" y="58" text-anchor="middle" class="t-sub">dépouillé de son fatras.</text><text x="170" y="92" text-anchor="middle" class="t-sub">C’est aussi simple que cela. C’est l’idée.</text></svg>