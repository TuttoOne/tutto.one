<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-label="Le même dossier encore, dans le dépôt"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="48" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Dans votre dossier personnel</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Une habitude que vous avez.</text><path d="M170,62 L170,78" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="84" width="300" height="48" rx="8" class="box-amber"/><text x="170" y="104" text-anchor="middle" class="t-band">Versionné dans le dépôt</text><text x="170" y="124" text-anchor="middle" class="t-lbl">Une norme que votre équipe a.</text><rect x="20" y="146" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="171" text-anchor="middle" class="t-white">L’imbrication parle d’audience, pas de disque</text></svg>