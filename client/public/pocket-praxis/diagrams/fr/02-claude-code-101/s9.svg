<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" role="img" aria-label="Un second passage, dans son propre contexte, en lecture seule"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">l’auteur</text><text x="70" y="40" text-anchor="middle" class="t-sub">porte son propre biais</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">le relecteur</text><text x="270" y="40" text-anchor="middle" class="t-sub">à froid, lecture seule</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="170" y="80" text-anchor="middle" class="t-sub">Il signale. Il ne corrige pas.</text><rect x="20" y="100" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="125" text-anchor="middle" class="t-white">Un œil neuf avant de pousser</text></svg>