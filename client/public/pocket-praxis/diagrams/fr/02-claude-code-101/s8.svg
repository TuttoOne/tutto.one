<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 318" role="img" aria-label="Le contexte est une mémoire de travail, et il se remplit"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Ce qui le remplit</text><rect x="20" y="34" width="300" height="66" rx="8" class="box"/><text x="170" y="54" text-anchor="middle" class="t-band">Tout ce qu’il touche</text><text x="170" y="74" text-anchor="middle" class="t-lbl">Chaque fichier lu, commande lancée,</text><text x="170" y="92" text-anchor="middle" class="t-sub">message envoyé.</text><line x1="20" y1="114" x2="320" y2="114" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="140" text-anchor="middle" class="t-band">Ce qui le garde utilisable</text><rect x="20" y="164" width="300" height="46" rx="8" class="box"/><text x="38" y="184" class="t-lbl">/compact</text><text x="38" y="200" class="t-sub">résumer, garder le fil</text><rect x="20" y="218" width="300" height="46" rx="8" class="box"/><text x="38" y="238" class="t-lbl">/clear</text><text x="38" y="254" class="t-sub">vider, repartir à neuf</text><rect x="20" y="272" width="300" height="46" rx="8" class="box"/><text x="38" y="292" class="t-lbl">/context</text><text x="38" y="308" class="t-sub">voir ce qui le remplit</text></svg>