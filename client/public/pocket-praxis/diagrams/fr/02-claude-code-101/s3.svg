<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 244" role="img" aria-label="Une conversation rend du texte ; un agent fait le travail"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Une conversation</text><rect x="20" y="34" width="300" height="48" rx="8" class="box"/><text x="170" y="54" text-anchor="middle" class="t-band">Elle vous rend du texte</text><text x="170" y="74" text-anchor="middle" class="t-lbl">Vous le reportez vous-même.</text><line x1="20" y1="96" x2="320" y2="96" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="122" text-anchor="middle" class="t-band">Un agent</text><rect x="20" y="146" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="166" text-anchor="middle" class="t-band">Il entre dans vos fichiers</text><text x="170" y="186" text-anchor="middle" class="t-lbl">Lit, modifie, exécute.</text><text x="170" y="204" text-anchor="middle" class="t-sub">Puis décide de la suite.</text><text x="170" y="238" text-anchor="middle" class="t-sub">Seulement dans le dossier de lancement.</text></svg>