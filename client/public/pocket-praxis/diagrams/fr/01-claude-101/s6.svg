<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-label="Trois modes, choisis selon la taille du travail"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">Conversation</text><text x="38" y="36" class="t-sub">une question rapide, un court jet</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">Cowork</text><text x="38" y="90" class="t-sub">un long travail sur de nombreux fichiers</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">Code</text><text x="38" y="144" class="t-sub">le travail le plus lourd, dans votre dossier</text><text x="170" y="180" text-anchor="middle" class="t-sub">Cowork et Code reposent sur Claude Code en dessous.</text></svg>