<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 274" role="img" aria-label="Quatre façons dont une réponse déçoit, et le remède de chacune"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Quand ça déraille</text><rect x="20" y="34" width="300" height="46" rx="8" class="box"/><text x="38" y="54" class="t-lbl">Trop générique</text><text x="38" y="70" class="t-sub">vous avez omis le contexte</text><rect x="20" y="88" width="300" height="46" rx="8" class="box"/><text x="38" y="108" class="t-lbl">Mauvais format</text><text x="38" y="124" class="t-sub">vous n’avez pas dit à quoi ça doit ressembler</text><rect x="20" y="142" width="300" height="46" rx="8" class="box"/><text x="38" y="162" class="t-lbl">Assuré mais faux</text><text x="38" y="178" class="t-sub">demandez les sources, puis vérifiez</text><rect x="20" y="196" width="300" height="46" rx="8" class="box"/><text x="38" y="216" class="t-lbl">Ton inadapté</text><text x="38" y="232" class="t-sub">montrez-lui un exemple de bon</text><text x="170" y="268" text-anchor="middle" class="t-sub">Presque toujours le prompt, pas l’outil.</text></svg>