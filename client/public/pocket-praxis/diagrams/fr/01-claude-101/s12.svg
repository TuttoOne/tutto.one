<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 338" role="img" aria-label="La recherche approfondie planifie, cherche encore et encore, puis rédige"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Une recherche</text><rect x="50" y="34" width="240" height="54" rx="8" class="box"/><text x="170" y="56" text-anchor="middle" class="t-lbl">demander</text><text x="170" y="74" text-anchor="middle" class="t-sub">une page de résultats</text><line x1="20" y1="102" x2="320" y2="102" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="128" text-anchor="middle" class="t-band">Recherche approfondie</text><rect x="20" y="152" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="175" r="11" class="s-amber"/><text x="44" y="179" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">1</text><text x="66" y="172" class="t-lbl">Planifie</text><text x="66" y="188" class="t-sub">ce qu’elle doit découvrir</text><rect x="20" y="206" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="229" r="11" class="s-amber"/><text x="44" y="233" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">2</text><text x="66" y="226" class="t-lbl">Cherche</text><text x="66" y="242" class="t-sub">beaucoup, chacune sur la précédente</text><rect x="20" y="260" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="283" r="11" class="s-amber"/><text x="44" y="287" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">3</text><text x="66" y="280" class="t-lbl">Rédige</text><text x="66" y="296" class="t-sub">chaque affirmation sourcée</text><text x="170" y="332" text-anchor="middle" class="t-sub">Des minutes, pas des secondes. Vérifiez l’essentiel.</text></svg>