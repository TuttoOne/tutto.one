<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Les projets stockent le savoir ; les compétences exécutent le travail"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Un projet</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Stocke le savoir.</text><text x="170" y="58" text-anchor="middle" class="t-sub">Le quoi.</text><path d="M170,80 L170,96" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><rect x="20" y="102" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="122" text-anchor="middle" class="t-band">Une compétence</text><text x="170" y="142" text-anchor="middle" class="t-lbl">Exécute le travail.</text><text x="170" y="160" text-anchor="middle" class="t-sub">Le comment.</text><text x="170" y="194" text-anchor="middle" class="t-sub">Celles d’Anthropic, ou les vôtres.</text></svg>