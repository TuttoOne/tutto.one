<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-label="Le plancher, et ce que vous ajoutez dessus"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="48" rx="8" class="box-amber"/><text x="170" y="20" text-anchor="middle" class="t-band">Le plancher, toujours actif</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Il demande avant de supprimer.</text><line x1="20" y1="62" x2="320" y2="62" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="88" text-anchor="middle" class="t-band">Ce que vous ajoutez</text><rect x="20" y="112" width="300" height="34" rx="8" class="box"/><text x="38" y="134" class="t-lbl">un dossier dédié</text><rect x="20" y="154" width="300" height="34" rx="8" class="box"/><text x="38" y="176" class="t-lbl">l’irremplaçable sauvegardé</text><rect x="20" y="196" width="300" height="34" rx="8" class="box"/><text x="38" y="218" class="t-lbl">une copie pour tester</text></svg>