<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-label="La conversation réfléchit avec vous ; Cowork fait le travail"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Conversation</text><rect x="20" y="34" width="300" height="66" rx="8" class="box"/><text x="170" y="54" text-anchor="middle" class="t-band">Tour par tour</text><text x="170" y="74" text-anchor="middle" class="t-lbl">Vous réfléchissez à voix haute.</text><text x="170" y="92" text-anchor="middle" class="t-sub">Vous faites le travail.</text><line x1="20" y1="114" x2="320" y2="114" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="140" text-anchor="middle" class="t-band">Cowork</text><rect x="20" y="164" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="184" text-anchor="middle" class="t-band">Vous confiez un résultat</text><text x="170" y="204" text-anchor="middle" class="t-lbl">Il planifie, exécute les étapes,</text><text x="170" y="222" text-anchor="middle" class="t-sub">et livre.</text></svg>