<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 162" role="img" aria-label="Transformez le prompt qui marche en fichier"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="40" rx="8" class="box"/><text x="170" y="25" text-anchor="middle" class="t-lbl">un prompt qui a marché une fois</text><path d="M170,54 L170,70" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="68" class="t-sub">demandez-lui de l’écrire</text><rect x="50" y="76" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="98" text-anchor="middle" class="t-lbl">une compétence relançable</text><text x="170" y="116" text-anchor="middle" class="t-sub">de la même façon à chaque fois</text><text x="170" y="156" text-anchor="middle" class="t-sub">Demandez-lui de vous poser d’abord des questions.</text></svg>