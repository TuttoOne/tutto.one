<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img" aria-label="Ce que cela ne vous donne pas"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="34" rx="8" class="box"/><text x="38" y="22" class="t-lbl">un résultat pour d’autres documents</text><rect x="20" y="42" width="300" height="34" rx="8" class="box"/><text x="38" y="64" class="t-lbl">ce que vous n’avez pas spécifié</text><rect x="20" y="84" width="300" height="34" rx="8" class="box"/><text x="38" y="106" class="t-lbl">une raison d’arrêter de regarder</text><rect x="20" y="132" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="154" text-anchor="middle" class="t-white">Un chiffre auquel on se fie trop est pire</text><text x="170" y="172" text-anchor="middle" class="t-white">que rien</text></svg>