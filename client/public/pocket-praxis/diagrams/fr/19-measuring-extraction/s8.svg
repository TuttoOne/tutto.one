<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 138" role="img" aria-label="Quelqu’un a écrit la bonne réponse"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="20" text-anchor="middle" class="t-band">Le corrigé</text><text x="170" y="40" text-anchor="middle" class="t-lbl">À la main, champ par champ,</text><text x="170" y="58" text-anchor="middle" class="t-sub">vérifié dans le document.</text><rect x="20" y="80" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="102" text-anchor="middle" class="t-white">Pas généré, sinon vous notez son travail</text><text x="170" y="120" text-anchor="middle" class="t-white">avec son travail</text></svg>