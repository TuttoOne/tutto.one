<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 316" role="img" aria-label="Six gestes, et celui que l’on oublie"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="34" rx="8" class="box"/><text x="38" y="22" class="t-lbl">donner du contexte</text><rect x="20" y="42" width="300" height="34" rx="8" class="box"/><text x="38" y="64" class="t-lbl">montrer des exemples</text><rect x="20" y="84" width="300" height="34" rx="8" class="box"/><text x="38" y="106" class="t-lbl">préciser les contraintes</text><rect x="20" y="126" width="300" height="34" rx="8" class="box"/><text x="38" y="148" class="t-lbl">découper en étapes</text><rect x="20" y="168" width="300" height="34" rx="8" class="box"/><text x="38" y="190" class="t-lbl">lui demander de réfléchir</text><rect x="20" y="210" width="300" height="34" rx="8" class="box"/><text x="38" y="232" class="t-lbl">définir rôle et ton</text><rect x="20" y="258" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="280" text-anchor="middle" class="t-white">Puis tendez-lui votre prompt et demandez-</text><text x="170" y="298" text-anchor="middle" class="t-white">lui de l’améliorer</text></svg>