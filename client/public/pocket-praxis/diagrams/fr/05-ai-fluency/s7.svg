<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 216" role="img" aria-label="Forte là où vous êtes faible"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Forte</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Ampleur, fluidité, outils,</text><text x="170" y="58" text-anchor="middle" class="t-sub">tenir un fil.</text><line x1="20" y1="80" x2="320" y2="80" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><rect x="20" y="96" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="116" text-anchor="middle" class="t-band">Bornée</text><text x="170" y="136" text-anchor="middle" class="t-lbl">Une date de coupure. L’hallucination.</text><text x="170" y="154" text-anchor="middle" class="t-sub">Un contexte fini.</text><rect x="20" y="176" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="201" text-anchor="middle" class="t-white">Un humain avec l’IA bat chacun seul</text></svg>