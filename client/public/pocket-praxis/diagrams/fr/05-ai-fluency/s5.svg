<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 234" role="img" aria-label="Quatre compétences, et la place de chacune"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">Délégation</text><text x="170" y="40" text-anchor="middle" class="t-sub">met en place</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="0" y="90" width="140" height="54" rx="8" class="box"/><text x="70" y="112" text-anchor="middle" class="t-lbl">Description</text><text x="70" y="130" text-anchor="middle" class="t-sub">dites votre besoin</text><rect x="200" y="90" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="112" text-anchor="middle" class="t-lbl">Discernement</text><text x="270" y="130" text-anchor="middle" class="t-sub">jugez ce qui revient</text><path d="M144,108 L194,108" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><path d="M196,128 L146,128" class="l-amber" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pk-b)"/><path d="M170,158 L170,174" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="50" y="180" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="202" text-anchor="middle" class="t-lbl">Diligence</text><text x="170" y="220" text-anchor="middle" class="t-sub">vous assumez le résultat</text></svg>