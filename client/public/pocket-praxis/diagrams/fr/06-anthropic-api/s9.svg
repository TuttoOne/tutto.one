<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="Indexez une fois, récupérez ce qu’il faut"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">votre base de connaissances</text><text x="170" y="40" text-anchor="middle" class="t-sub">trop grosse pour un prompt</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="82" class="t-sub">indexer une fois</text><rect x="0" y="90" width="140" height="54" rx="8" class="box"/><text x="70" y="112" text-anchor="middle" class="t-lbl">embeddings</text><text x="70" y="130" text-anchor="middle" class="t-sub">captent le sens</text><rect x="200" y="90" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="112" text-anchor="middle" class="t-lbl">mots-clés</text><text x="270" y="130" text-anchor="middle" class="t-sub">captent les termes</text><path d="M144,108 L194,108" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="158" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="183" text-anchor="middle" class="t-white">Seuls les rares extraits utiles à la question</text></svg>