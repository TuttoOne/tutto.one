<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 244" role="img" aria-label="Le validateur d’abord, puis le symptôme au remède"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="22" text-anchor="middle" class="t-lbl">le validateur de compétences</text><text x="170" y="40" text-anchor="middle" class="t-sub">la structure, avant de déboguer la logique</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="90" width="300" height="46" rx="8" class="box"/><text x="38" y="110" class="t-lbl">Ne se déclenche pas</text><text x="38" y="126" class="t-sub">affûtez la description</text><rect x="20" y="144" width="300" height="46" rx="8" class="box"/><text x="38" y="164" class="t-lbl">Ne se charge pas</text><text x="38" y="180" class="t-sub">vérifiez les noms</text><rect x="20" y="198" width="300" height="46" rx="8" class="box"/><text x="38" y="218" class="t-lbl">La mauvaise se déclenche</text><text x="38" y="234" class="t-sub">deux descriptions se recoupent</text></svg>