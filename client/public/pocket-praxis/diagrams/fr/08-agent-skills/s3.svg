<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 278" role="img" aria-label="Seule la description est retenue jusqu’à correspondance"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="40" rx="8" class="box"/><text x="170" y="25" text-anchor="middle" class="t-lbl">votre demande</text><path d="M170,54 L170,70" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="50" y="76" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="98" text-anchor="middle" class="t-lbl">une description d’une ligne</text><text x="170" y="116" text-anchor="middle" class="t-sub">toujours en tête</text><path d="M170,144 L170,160" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="158" class="t-sub">si ça correspond</text><rect x="50" y="166" width="240" height="40" rx="8" class="box"/><text x="170" y="191" text-anchor="middle" class="t-lbl">les instructions complètes se chargent</text><rect x="20" y="220" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="242" text-anchor="middle" class="t-white">Vous l’expliquez sans cesse ? C’est une</text><text x="170" y="260" text-anchor="middle" class="t-white">compétence en attente</text></svg>