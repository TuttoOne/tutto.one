<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 126" role="img" aria-label="Deux moitiés d’un même système"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">le cadre 4D</text><text x="70" y="40" text-anchor="middle" class="t-sub">votre façon de faire</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">ce cours</text><text x="270" y="40" text-anchor="middle" class="t-sub">son comportement</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><path d="M196,38 L146,38" class="l-amber" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pk-b)"/><rect x="20" y="68" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="90" text-anchor="middle" class="t-white">Les propriétés restent quand les frontières</text><text x="170" y="108" text-anchor="middle" class="t-white">bougent</text></svg>