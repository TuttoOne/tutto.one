<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 208" role="img" aria-label="Les défaillances sont deux propriétés qui se rencontrent"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">Prédiction + connaissance</text><text x="38" y="36" class="t-sub">détails hallucinés</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">Mémoire + pilotabilité</text><text x="38" y="90" class="t-sub">dérive en long contexte</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">Prédiction + pilotabilité</text><text x="38" y="144" class="t-sub">calculs faux avec assurance</text><rect x="20" y="168" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="193" text-anchor="middle" class="t-white">Une défaillance nommée a un remède assorti</text></svg>