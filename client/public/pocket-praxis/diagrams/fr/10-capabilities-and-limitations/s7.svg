<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="Il sait ce qu’il a lu"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="48" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">La mauvaise question</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Sait-il cela ?</text><path d="M170,62 L170,78" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><rect x="20" y="84" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="104" text-anchor="middle" class="t-band">La meilleure</text><text x="170" y="124" text-anchor="middle" class="t-lbl">À quel point cela était-il représenté</text><text x="170" y="142" text-anchor="middle" class="t-sub">dans ce qu’il a lu ?</text><text x="170" y="176" text-anchor="middle" class="t-sub">Il prend la vue du profane sur votre métier pour</text><text x="170" y="192" text-anchor="middle" class="t-sub">la norme.</text></svg>