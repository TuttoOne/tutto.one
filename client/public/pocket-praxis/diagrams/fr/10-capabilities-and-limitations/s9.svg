<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 216" role="img" aria-label="La lettre, pas l’esprit"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="20" text-anchor="middle" class="t-band">Fort sur</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Court, concret, vérifiable.</text><text x="170" y="58" text-anchor="middle" class="t-sub">Format, longueur, rôle.</text><line x1="20" y1="80" x2="320" y2="80" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><rect x="20" y="96" width="300" height="48" rx="8" class="box"/><text x="170" y="116" text-anchor="middle" class="t-band">Faible sur</text><text x="170" y="136" text-anchor="middle" class="t-lbl">Calcul, longues chaînes logiques.</text><rect x="20" y="158" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="180" text-anchor="middle" class="t-white">Déportez le calcul : demandez-lui d’écrire</text><text x="170" y="198" text-anchor="middle" class="t-white">le code</text></svg>