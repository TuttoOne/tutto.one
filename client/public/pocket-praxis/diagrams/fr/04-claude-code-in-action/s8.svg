<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 234" role="img" aria-label="Le diff est le mécanisme de confiance"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">vous décrivez la modification</text><text x="170" y="40" text-anchor="middle" class="t-sub">en français courant</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="50" y="90" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="112" text-anchor="middle" class="t-lbl">le diff</text><text x="170" y="130" text-anchor="middle" class="t-sub">exactement ce qui a changé</text><path d="M170,158 L170,174" class="l-amber" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pk-b)"/><text x="180" y="172" class="t-sub">validez ou affinez</text><rect x="50" y="180" width="240" height="54" rx="8" class="box"/><text x="170" y="202" text-anchor="middle" class="t-lbl">valider</text><text x="170" y="220" text-anchor="middle" class="t-sub">seulement quand c’est bon</text></svg>