<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Quatre façons de faire entrer du contexte"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="23" r="11" class="s-amber"/><text x="44" y="27" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">1</text><text x="66" y="20" class="t-lbl">@fichier</text><text x="66" y="36" class="t-sub">nommez un fichier ou dossier</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="77" r="11" class="s-amber"/><text x="44" y="81" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">2</text><text x="66" y="74" class="t-lbl">Coller</text><text x="66" y="90" class="t-sub">erreurs, journaux, images</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="131" r="11" class="s-amber"/><text x="44" y="135" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">3</text><text x="66" y="128" class="t-lbl">CLAUDE.md</text><text x="66" y="144" class="t-sub">règles permanentes, chaque session</text><rect x="20" y="162" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="185" r="11" class="s-amber"/><text x="44" y="189" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">4</text><text x="66" y="182" class="t-lbl">Le laisser chercher</text><text x="66" y="198" class="t-sub">dans le dépôt lui-même</text><rect x="20" y="222" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="244" text-anchor="middle" class="t-white">Un prompt vague coûte plus de contexte,</text><text x="170" y="262" text-anchor="middle" class="t-white">pas moins</text></svg>