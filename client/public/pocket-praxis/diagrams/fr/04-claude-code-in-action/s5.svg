<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" role="img" aria-label="Une ligne, puis la connexion"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">une commande d’installation</text><text x="170" y="40" text-anchor="middle" class="t-sub">quelle que soit la plateforme</text><path d="M170,68 L170,84" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><rect x="50" y="90" width="240" height="54" rx="8" class="box"/><text x="170" y="112" text-anchor="middle" class="t-lbl">claude</text><text x="170" y="130" text-anchor="middle" class="t-sub">choisissez un thème, connectez-vous</text><text x="170" y="170" text-anchor="middle" class="t-sub">Des erreurs ? Demandez à Claude de vous guider.</text></svg>