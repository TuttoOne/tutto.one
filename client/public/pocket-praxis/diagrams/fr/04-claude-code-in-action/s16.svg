<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 178" role="img" aria-label="Le même agent, dans votre propre logiciel"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">Claude Code</text><text x="170" y="40" text-anchor="middle" class="t-sub">boucle, outils, contexte, permissions</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="82" class="t-sub">le SDK</text><rect x="50" y="90" width="240" height="40" rx="8" class="box-amber"/><text x="170" y="115" text-anchor="middle" class="t-lbl">un composant qui vous sert à bâtir</text><text x="170" y="156" text-anchor="middle" class="t-sub">Le plafond. Le workflow bâti à la main pourra</text><text x="170" y="172" text-anchor="middle" class="t-sub">tourner seul.</text></svg>