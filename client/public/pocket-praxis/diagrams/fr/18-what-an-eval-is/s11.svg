<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 102" role="img" aria-label="Deux moitiés, construites à la main"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">cette séance</text><text x="70" y="40" text-anchor="middle" class="t-sub">la carte</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">l’atelier</text><text x="270" y="40" text-anchor="middle" class="t-sub">bâtie de bout en bout</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="170" y="80" text-anchor="middle" class="t-sub">Le plus dur est un jugement métier, pas un jugement</text><text x="170" y="96" text-anchor="middle" class="t-sub">technique.</text></svg>