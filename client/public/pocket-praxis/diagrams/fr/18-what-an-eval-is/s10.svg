<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 222" role="img" aria-label="Le coût tombe dans l’autre sens"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="66" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Ce que l’on suppose</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Bon marché à démarrer.</text><text x="170" y="58" text-anchor="middle" class="t-sub">Coûteux à faire tourner.</text><path d="M170,80 L170,96" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><rect x="20" y="102" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="122" text-anchor="middle" class="t-band">Ce qui est vrai</text><text x="170" y="142" text-anchor="middle" class="t-lbl">Coûteux à démarrer : décider</text><text x="170" y="160" text-anchor="middle" class="t-sub">ce qui compte comme correct.</text><rect x="20" y="182" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="207" text-anchor="middle" class="t-white">Le code fait une vingtaine de lignes</text></svg>