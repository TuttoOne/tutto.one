<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 226" role="img" aria-label="The middle of a long context gets lost"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">The start</text><text x="38" y="36" class="t-sub">attended to</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">The middle</text><text x="38" y="90" class="t-sub">quietly drops out</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">The end</text><text x="38" y="144" class="t-sub">attended to</text><rect x="20" y="168" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="190" text-anchor="middle" class="t-white">A hard edge: past the limit, it is</text><text x="170" y="208" text-anchor="middle" class="t-white">simply gone</text></svg>