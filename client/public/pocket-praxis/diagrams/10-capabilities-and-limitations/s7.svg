<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="It knows what it read"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="48" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">The wrong question</text><text x="170" y="40" text-anchor="middle" class="t-lbl">Does it know this?</text><path d="M170,62 L170,78" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><rect x="20" y="84" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="104" text-anchor="middle" class="t-band">The better one</text><text x="170" y="124" text-anchor="middle" class="t-lbl">How well represented was this</text><text x="170" y="142" text-anchor="middle" class="t-sub">in what it read?</text><text x="170" y="176" text-anchor="middle" class="t-sub">It treats the outsider's view of your field as</text><text x="170" y="192" text-anchor="middle" class="t-sub">normal.</text></svg>