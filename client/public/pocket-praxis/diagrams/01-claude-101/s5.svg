<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 274" role="img" aria-label="Four ways an answer disappoints, and the fix for each"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">When it's off</text><rect x="20" y="34" width="300" height="46" rx="8" class="box"/><text x="38" y="54" class="t-lbl">Too generic</text><text x="38" y="70" class="t-sub">you left out the context</text><rect x="20" y="88" width="300" height="46" rx="8" class="box"/><text x="38" y="108" class="t-lbl">Wrong format</text><text x="38" y="124" class="t-sub">you never said what it should look like</text><rect x="20" y="142" width="300" height="46" rx="8" class="box"/><text x="38" y="162" class="t-lbl">Confident but wrong</text><text x="38" y="178" class="t-sub">ask for sources, then verify</text><rect x="20" y="196" width="300" height="46" rx="8" class="box"/><text x="38" y="216" class="t-lbl">Tone off</text><text x="38" y="232" class="t-sub">show it one example of good</text><text x="170" y="268" text-anchor="middle" class="t-sub">Almost always the prompt, not the tool.</text></svg>