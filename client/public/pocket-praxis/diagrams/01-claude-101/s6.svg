<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-label="Three modes, picked by the size of the job"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">Chat</text><text x="38" y="36" class="t-sub">a quick question, a short draft</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">Cowork</text><text x="38" y="90" class="t-sub">a long job across many files</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">Code</text><text x="38" y="144" class="t-sub">the heaviest work, in your folder</text><text x="170" y="180" text-anchor="middle" class="t-sub">Cowork and Code run on Claude Code underneath.</text></svg>