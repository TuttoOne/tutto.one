<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 338" role="img" aria-label="Research plans, searches repeatedly, then writes it up"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">One search</text><rect x="50" y="34" width="240" height="54" rx="8" class="box"/><text x="170" y="56" text-anchor="middle" class="t-lbl">ask</text><text x="170" y="74" text-anchor="middle" class="t-sub">a page of results</text><line x1="20" y1="102" x2="320" y2="102" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="128" text-anchor="middle" class="t-band">Research</text><rect x="20" y="152" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="175" r="11" class="s-amber"/><text x="44" y="179" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">1</text><text x="66" y="172" class="t-lbl">Plans</text><text x="66" y="188" class="t-sub">what it needs to find out</text><rect x="20" y="206" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="229" r="11" class="s-amber"/><text x="44" y="233" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">2</text><text x="66" y="226" class="t-lbl">Searches</text><text x="66" y="242" class="t-sub">many, each building on the last</text><rect x="20" y="260" width="300" height="46" rx="8" class="box"/><circle cx="44" cy="283" r="11" class="s-amber"/><text x="44" y="287" text-anchor="middle" class="t-band" fill="hsl(var(--primary-foreground))">3</text><text x="66" y="280" class="t-lbl">Writes it up</text><text x="66" y="296" class="t-sub">every claim cited</text><text x="170" y="332" text-anchor="middle" class="t-sub">Minutes, not seconds. Still verify what matters.</text></svg>