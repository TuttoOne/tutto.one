<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-label="A project holds what you would otherwise repeat"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">Without a project</text><rect x="20" y="34" width="300" height="66" rx="8" class="box"/><text x="170" y="54" text-anchor="middle" class="t-band">Every chat</text><text x="170" y="74" text-anchor="middle" class="t-lbl">Re-upload the files.</text><text x="170" y="92" text-anchor="middle" class="t-sub">Re-explain the rules.</text><line x1="20" y1="114" x2="320" y2="114" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="140" text-anchor="middle" class="t-band">With one</text><rect x="20" y="164" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="184" text-anchor="middle" class="t-band">The project holds it</text><text x="170" y="204" text-anchor="middle" class="t-lbl">Knowledge, instructions, memory.</text><text x="170" y="222" text-anchor="middle" class="t-sub">Every chat starts briefed.</text></svg>