<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 354" role="img" aria-label="A chatbot answers once; a thinking partner works the problem with you"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">A chatbot</text><rect x="50" y="34" width="240" height="40" rx="8" class="box"/><text x="170" y="59" text-anchor="middle" class="t-lbl">you ask</text><path d="M170,88 L170,104" class="l-faint" stroke-width="1.5" marker-end="url(#pk-a)"/><rect x="50" y="110" width="240" height="40" rx="8" class="box"/><text x="170" y="135" text-anchor="middle" class="t-lbl">it answers</text><text x="170" y="176" text-anchor="middle" class="t-sub">Then you're on your own.</text><line x1="20" y1="196" x2="320" y2="196" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="222" text-anchor="middle" class="t-band">A thinking partner</text><rect x="0" y="246" width="140" height="54" rx="8" class="box"/><text x="70" y="268" text-anchor="middle" class="t-lbl">you</text><text x="70" y="286" text-anchor="middle" class="t-sub">context, judgement</text><rect x="200" y="246" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="268" text-anchor="middle" class="t-lbl">Claude</text><text x="270" y="286" text-anchor="middle" class="t-sub">everything general</text><path d="M144,264 L194,264" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><path d="M196,284 L146,284" class="l-amber" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pk-b)"/><rect x="20" y="314" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="339" text-anchor="middle" class="t-white">You work the problem together</text></svg>