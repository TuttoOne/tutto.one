<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 178" role="img" aria-label="Connectors reach your tools, inside your existing permissions"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box"/><text x="170" y="22" text-anchor="middle" class="t-lbl">Claude</text><text x="170" y="40" text-anchor="middle" class="t-sub">in the conversation</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="82" class="t-sub">MCP</text><rect x="20" y="90" width="300" height="34" rx="8" class="box"/><text x="38" y="112" class="t-lbl">your email, drive, tickets, repos</text><rect x="20" y="138" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="163" text-anchor="middle" class="t-white">It sees only what you can see</text></svg>