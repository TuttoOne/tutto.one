<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 216" role="img" aria-label="Cache the part that never changes"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="50" y="0" width="240" height="54" rx="8" class="box-amber"/><text x="170" y="22" text-anchor="middle" class="t-lbl">the stable prefix</text><text x="170" y="40" text-anchor="middle" class="t-sub">system prompt, tools, documents</text><path d="M170,68 L170,84" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="180" y="82" class="t-sub">cached, paid for once</text><rect x="50" y="90" width="240" height="54" rx="8" class="box"/><text x="170" y="112" text-anchor="middle" class="t-lbl">the variable part</text><text x="170" y="130" text-anchor="middle" class="t-sub">put it last</text><rect x="20" y="158" width="300" height="58" rx="8" class="box-ink"/><text x="170" y="180" text-anchor="middle" class="t-white">Only an exact, unchanged prefix is</text><text x="170" y="198" text-anchor="middle" class="t-white">reused</text></svg>