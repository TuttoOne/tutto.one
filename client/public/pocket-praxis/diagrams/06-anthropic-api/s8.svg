<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-label="A few tools you do not build"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">text editor</text><text x="38" y="36" class="t-sub">edits files in place</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">web search</text><text x="38" y="90" class="t-sub">live results, with citations</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">code execution</text><text x="38" y="144" class="t-sub">Python, in an isolated sandbox</text><text x="170" y="180" text-anchor="middle" class="t-sub">Anthropic runs these server-side. You switch them on.</text></svg>