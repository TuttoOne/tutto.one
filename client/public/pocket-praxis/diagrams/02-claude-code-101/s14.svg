<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 266" role="img" aria-label="A hook runs every time, with no exceptions"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><text x="170" y="10" text-anchor="middle" class="t-band">An instruction</text><rect x="20" y="34" width="300" height="48" rx="8" class="box"/><text x="170" y="54" text-anchor="middle" class="t-band">Read, and can be missed</text><text x="170" y="74" text-anchor="middle" class="t-lbl">A suggestion in a file.</text><line x1="20" y1="96" x2="320" y2="96" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="122" text-anchor="middle" class="t-band">A hook</text><rect x="20" y="146" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="166" text-anchor="middle" class="t-band">Runs every time</text><text x="170" y="186" text-anchor="middle" class="t-lbl">On submit, before a tool,</text><text x="170" y="204" text-anchor="middle" class="t-sub">after a tool, when Claude stops.</text><rect x="20" y="226" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="251" text-anchor="middle" class="t-white">Guaranteed, not suggested</text></svg>