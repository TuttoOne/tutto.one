<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" role="img" aria-label="A second pass, in its own context, read-only"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="0" y="0" width="140" height="54" rx="8" class="box"/><text x="70" y="22" text-anchor="middle" class="t-lbl">the writer</text><text x="70" y="40" text-anchor="middle" class="t-sub">carries its own bias</text><rect x="200" y="0" width="140" height="54" rx="8" class="box-amber"/><text x="270" y="22" text-anchor="middle" class="t-lbl">the reviewer</text><text x="270" y="40" text-anchor="middle" class="t-sub">cold, read-only</text><path d="M144,18 L194,18" class="l-amber" stroke-width="2" marker-end="url(#pk-b)"/><text x="170" y="80" text-anchor="middle" class="t-sub">It flags. It doesn't fix.</text><rect x="20" y="100" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="125" text-anchor="middle" class="t-white">Fresh eyes before you push</text></svg>