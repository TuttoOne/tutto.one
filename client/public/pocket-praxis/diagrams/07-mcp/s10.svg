<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="The app decides what loads"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="48" rx="8" class="box"/><text x="170" y="20" text-anchor="middle" class="t-band">Tools</text><text x="170" y="40" text-anchor="middle" class="t-lbl">The model reaches for them.</text><line x1="20" y1="62" x2="320" y2="62" class="l-faint" stroke-width="1" stroke-dasharray="3 4"/><rect x="20" y="78" width="300" height="66" rx="8" class="box-amber"/><text x="170" y="98" text-anchor="middle" class="t-band">Resources</text><text x="170" y="118" text-anchor="middle" class="t-lbl">You pick them, item by item.</text><text x="170" y="136" text-anchor="middle" class="t-sub">Usually an @-mention.</text><rect x="20" y="158" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="183" text-anchor="middle" class="t-white">It does not help itself to your data</text></svg>