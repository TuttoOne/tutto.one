<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 208" role="img" aria-label="Three primitives, three owners"><defs><marker id="pk-a" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--muted-foreground))"/></marker><marker id="pk-b" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="hsl(var(--primary))"/></marker></defs><rect x="20" y="0" width="300" height="46" rx="8" class="box"/><text x="38" y="20" class="t-lbl">Tools</text><text x="38" y="36" class="t-sub">the model triggers them</text><rect x="20" y="54" width="300" height="46" rx="8" class="box"/><text x="38" y="74" class="t-lbl">Resources</text><text x="38" y="90" class="t-sub">the app loads them</text><rect x="20" y="108" width="300" height="46" rx="8" class="box"/><text x="38" y="128" class="t-lbl">Prompts</text><text x="38" y="144" class="t-sub">you trigger them</text><rect x="20" y="168" width="300" height="40" rx="8" class="box-ink"/><text x="170" y="193" text-anchor="middle" class="t-white">You see only what you can see</text></svg>