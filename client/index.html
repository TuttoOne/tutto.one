    <meta name="description" content="For work that cannot go in the cloud. We build AI that stands in your own building, reads your files where they already sit, and cites the page every answer came from. You own the hardware. Nothing is uploaded." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

         serif (`--font-serif`), which is what `h1`-`h6` resolve to. These are
         the two families the brand uses; the front door briefly set its
         headings in Source Serif 4 and that has been taken back out. -->
